<!DOCTYPE html>
<html>
  <head>
    <title>Founder Training</title>

    <head>
  <title>Founder Training</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 8px;
      font-size: 14px;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px; 
    }

    #clearButton {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    #clearButton:hover {
      background-color: #c0392b;
    }

    .deletebutton {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 4px 8px;
      margin-left: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }

    table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f4f4f4;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

  </style>
  </head>
  <body>
    <h1>Day 1</h1>

    <input id="campaignName" placeholder="Campaign Name">
    <input id="spend" placeholder="Ad Spend">
    <input id="revenue" placeholder="Revenue">
    <input id="costOfGoods" placeholder="Cost of goods">
    <button onclick="calculate()">Calculate ROI</button>
    <button id="clearButton" onclick="clearCampaigns()">Clear Campaigns</button>

    <p id="result"></p>

    <h2>Campaign Results</h2>
    <button onclick="sortByROI()">Sort by ROI</button>
    <table id="campaignTable">
    <thead>
      <tr>
        <th>Campaign</th>
        <th>Spend</th>
        <th>Revenue</th>
        <th>COGS</th>
        <th>Profit</th>
        <th>ROI</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="campaignList">
    </tbody>
  </table>

    <h2>Campaign Summary</h2>

  <div id="summary">
    <p>Total Spend: $<span id="totalSpend">0</span></p>
    <p>Total Revenue: $<span id="totalRevenue">0</span></p>
    <p>Total Cost of Goods: $<span id="totalcostOfGoods">0</span></p>
    <p>Total Profit: $<span id="totalProfit">0</span></p>
    <p>Average ROI: <span id="avgROI">0</span>%</p>
  </div>
  

    <script src="script.js"></script>
  </body>
</html>
